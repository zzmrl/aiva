services:
  api:
    build:
      context: ./api
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./api:/api

  webui:
    build:
      context: ./webui
      target: dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./webui:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started

  ngrok:
    image: ngrok/ngrok:alpine
    restart: unless-stopped
    command: http http://api:3274 --url ${PUBLIC_HOST:?Static ngrok domain}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Ngrok auth token found in dashboard}
    ports:
      - "4040:4040"
    depends_on:
      - api
