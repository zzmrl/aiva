<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Chat bubble body -->
  <rect x="24" y="30" width="68" height="52" rx="14" ry="14" fill="#fff" opacity="0.95"/>
  <!-- Chat bubble tail -->
  <polygon points="36,82 28,98 52,82" fill="#fff" opacity="0.95"/>
  <!-- Signal arcs representing AI/voice -->
  <path d="M96 44a20 20 0 0 1 0 28" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M104 36a32 32 0 0 1 0 44" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Dots inside bubble representing typing/processing -->
  <circle cx="42" cy="56" r="5" fill="url(#bg)"/>
  <circle cx="58" cy="56" r="5" fill="url(#bg)" opacity="0.7"/>
  <circle cx="74" cy="56" r="5" fill="url(#bg)" opacity="0.4"/>
</svg>
