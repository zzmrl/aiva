name: aiva
services:
  api:
    build: ./api
    develop:
      watch:
        - path: ./api/app
          action: sync+restart
          target: /api/app
          initial_sync: true
    restart: unless-stopped
    ports:
      - ${API_PORT:-3000}:${API_PORT:-3000}
    environment:
      PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: "postgres://$DATABASE_USER:$DATABASE_PASSWORD@$DATABASE_HOST:$DATABASE_PORT/$DATABASE_NAME"
      VENICE_API_KEY: ${VENICE_API_KEY:?Venice API key found in settings}
      TELNYX_APP_ID: ${TELNYX_APP_ID:?Telnyx app ID}
      TELNYX_API_KEY: ${TELNYX_API_KEY:?Unique Telnyx API key}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:?Telnyx public key for validation}
      REDIS_URL: redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?username for the account, also used for database name}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?password for the account}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: >
        pg_isready
        -U $$POSTGRES_USER
        -d $$POSTGRES_USER
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5

  web:
    build: ./webui
    restart: unless-stopped
    environment:
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-http://api:3000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
