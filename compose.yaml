name: aiva
services:
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://$$(cat /run/secrets/postgres_user):$$(cat /run/secrets/postgres_password)@database:5432/$$(cat /run/secrets/postgres_user)
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - postgres_password
      - postgres_user

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
    secrets:
      - postgres_password
      - postgres_user
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: >
        pg_isready
        -U $$(cat /run/secrets/postgres_user)
        -d $$(cat /run/secrets/postgres_user)
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: ./webui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_user:
    file: ./secrets/postgres_user

volumes:
  postgres_data:
  nginx_logs:
