name: aiva
services:
  api:
    build: ./api
    develop:
      watch:
        - path: ./api/app
          action: sync+restart
          target: /api/app
          initial_sync: true
    restart: unless-stopped
    ports:
      - "3274:3274"
    environment:
      PORT: 3274
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Database connection string}
      PUBLIC_HOST: ${PUBLIC_HOST:?Url of host}
      VENICE_API_KEY: ${VENICE_API_KEY:?Venice API key found in settings}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?user for database, also used for database name}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?password for database user}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: >
        pg_isready
        -U $$POSTGRES_USER
        -d $$POSTGRES_USER
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5

  web:
    build: ./webui
    restart: unless-stopped
    environment:
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-http://api:3274}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx

  ngrok:
    image: ngrok/ngrok:latest
    profiles: [dev]
    command: http api:3274 --url ${PUBLIC_HOST:?Static ngrok domain}
    environment:
      NGROK_AUTHTOKEN: $NGROK_AUTHTOKEN
    ports:
      - "4040:4040"
    depends_on:
      - api

volumes:
  postgres_data:
  nginx_logs:
