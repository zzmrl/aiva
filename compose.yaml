name: aiva
services:
  api:
    build: ./api
    develop:
      watch:
        - path: ./api/app
          action: sync+restart
          target: /api/app
          initial_sync: true
    restart: unless-stopped
    ports:
      - ${API_PORT:-3000}:${API_PORT:-3000}
    environment:
      PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_USER_FILE: /run/secrets/postgres_user
      DATABASE_NAME_FILE: /run/secrets/postgres_db
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      VENICE_API_KEY_FILE: /run/secrets/venice_api_key
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
      - venice_api_key

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: >
        pg_isready
        -U $$(cat /run/secrets/postgres_user)
        -d $$(cat /run/secrets/postgres_db)
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5

  web:
    build: ./webui
    restart: unless-stopped
    environment:
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-http://api:3000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_user:
    file: ./secrets/postgres_user
  postgres_db:
    file: ./secrets/postgres_user
  venice_api_key:
    file: ./secrets/venice_api_key
  database_url:
    file: ./secrets/database_url

volumes:
  postgres_data:
  nginx_logs:
