name: aiva
services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?user for database, also used for database name}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?password for database user}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_USER
      interval: 30s
      start_period: 3s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
