name: aiva
services:
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - postgres_password
      - postgres_user

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
    secrets:
      - postgres_password
      - postgres_user
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: >
        pg_isready
        -U $$(cat /run/secrets/postgres_user)
        -d $$(cat /run/secrets/postgres_user)
      interval: 30s
      timeout: 10s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_user:
    file: ./secrets/postgres_user

volumes:
  postgres_data:
